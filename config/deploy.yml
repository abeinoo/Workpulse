# ─────────────────────────────────────────────────────────────────────────────
# Kamal deployment configuration — workpulse.info (135.181.46.35)
# Docs: https://kamal-deploy.org
#
# First deploy:  kamal setup && kamal deploy
# Later deploys: kamal deploy
# View logs:     kamal logs
# Rails console: kamal console
# ─────────────────────────────────────────────────────────────────────────────

service: work_pulse

# Container image on GitHub Container Registry (ghcr.io).
# Format: ghcr.io/<github-owner>/<repo>  (must be lowercase)
image: ghcr.io/abeinoo/workpulse

# ── Production server ─────────────────────────────────────────────────────────
servers:
  web:
    - 135.181.46.35

# ── Thruster proxy with Let's Encrypt SSL ────────────────────────────────────
# Cloudflare DNS: set SSL/TLS encryption mode to "Full" (not Full Strict) so
# Cloudflare → origin TLS works without a trusted certificate on the origin.
proxy:
  ssl: true
  host: workpulse.info

# ── Docker registry — GitHub Container Registry ──────────────────────────────
# Authentication uses a GitHub PAT with write:packages scope.
# Generate at: https://github.com/settings/tokens (classic token)
# Add as KAMAL_REGISTRY_PASSWORD in .kamal/secrets (read from env).
registry:
  server: ghcr.io
  username: abeinoo
  password:
    - KAMAL_REGISTRY_PASSWORD

# ── Environment variables ─────────────────────────────────────────────────────
env:
  secret:
    - RAILS_MASTER_KEY        # 32-hex content of config/master.key
    - R2_ACCESS_KEY_ID        # Cloudflare R2 API token (Access Key ID)
    - R2_SECRET_ACCESS_KEY    # Cloudflare R2 API token (Secret)
    - R2_BUCKET               # R2 bucket name
    - R2_ENDPOINT             # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
    - DATABASE_URL            # postgres://work_pulse:<password>@<host>/work_pulse_production

  clear:
    RAILS_ENV:           production
    SOLID_QUEUE_IN_PUMA: "true"
    RAILS_MAX_THREADS:   "5"
    WEB_CONCURRENCY:     "2"
    JOB_CONCURRENCY:     "2"
    APP_HOST:            workpulse.info
    RAILS_LOG_LEVEL:     info

# ── Kamal CLI aliases ─────────────────────────────────────────────────────────
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole --include-password"
  migrate: app exec "bin/rails db:migrate"

# ── Persistent storage ────────────────────────────────────────────────────────
# Files go to Cloudflare R2 in production, but keep a local volume for
# tmp/cache/bootsnap so restarts don't lose ephemeral files.
volumes:
  - "work_pulse_storage:/rails/storage"

# ── Asset bridging ────────────────────────────────────────────────────────────
asset_path: /rails/public/assets

# ── Builder ───────────────────────────────────────────────────────────────────
builder:
  # Hetzner servers are amd64; this Mac may be arm64 — always cross-compile.
  arch: amd64
