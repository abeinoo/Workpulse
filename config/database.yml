default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary: &development_primary
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "work_pulse_development") %>
    host:     <%= ENV.fetch("DB_HOST", "localhost") %>
    port:     <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
    password: <%= ENV.fetch("DB_PASSWORD", "") %>
  cache:
    <<: *development_primary
    migrations_paths: db/cache_migrate
  queue:
    <<: *development_primary
    migrations_paths: db/queue_migrate
  cable:
    <<: *development_primary
    migrations_paths: db/cable_migrate

test:
  primary: &test_primary
    <<: *default
    database: work_pulse_test
    host:     <%= ENV.fetch("DB_HOST", "localhost") %>
    port:     <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
    password: <%= ENV.fetch("DB_PASSWORD", "") %>
  cache:
    <<: *test_primary
    migrations_paths: db/cache_migrate
  queue:
    <<: *test_primary
    migrations_paths: db/queue_migrate
  cable:
    <<: *test_primary
    migrations_paths: db/cable_migrate

# In production all four connections share a single PostgreSQL database.
# The solid_cache / solid_queue / solid_cable tables live alongside the
# main application tables in that one database.
production:
  primary: &production_primary
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *production_primary
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_primary
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_primary
    migrations_paths: db/cable_migrate
