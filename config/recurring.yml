production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  auto_generate_payroll:
    class: Payroll::AutoGenerateJob
    queue: background
    schedule: every day at 6:00am

  # ── Notification reminders ───────────────────────────────────────────────
  forgot_checkin_reminder:
    class: Notifications::ForgotCheckinReminderJob
    queue: background
    schedule: every day at 10:30am

  forgot_checkout_reminder:
    class: Notifications::ForgotCheckoutReminderJob
    queue: background
    schedule: every day at 7:00am

  daily_attendance_summary:
    class: Notifications::DailyAttendanceSummaryJob
    queue: background
    schedule: every day at 11:00am

  pending_approval_reminder:
    class: Notifications::PendingApprovalReminderJob
    queue: background
    schedule: every day at 2:00pm
