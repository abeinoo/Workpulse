# WorkPulse — Nginx reverse-proxy config
# Domains : workpulse.info  www.workpulse.info
# Backend : Rails/Thruster container on 127.0.0.1:3000
#
# Initial deploy (HTTP only — certbot adds HTTPS automatically):
#   sudo cp workpulse.conf /etc/nginx/sites-available/workpulse
#   sudo cp websocket_upgrade.conf /etc/nginx/conf.d/websocket_upgrade.conf
#   sudo ln -sf /etc/nginx/sites-available/workpulse /etc/nginx/sites-enabled/workpulse
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#   sudo certbot --nginx -d workpulse.info -d www.workpulse.info

server {
    listen 80;
    listen [::]:80;
    server_name workpulse.info www.workpulse.info;

    client_max_body_size 100M;

    # Rails health-check — must never redirect so Docker/uptime monitors work
    location = /up {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard reverse-proxy headers (Rails reads these)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket upgrade (Action Cable / Turbo Streams)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }
}
