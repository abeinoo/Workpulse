# Stock Transfer approval workflow and transfer reservations
# (Inventory::StockTransfer* services, Inventory::StockAvailability).
en:
  admin:
    permission_roles:
      groups:
        stock_transfers: Stock Transfers
      permissions:
        view_stock_transfers: View Stock Transfers
        create_stock_transfers: Create Stock Transfers
        approve_stock_transfers: Approve Stock Transfers (Post Stock Movement)
        edit_pending_stock_transfers: Edit Pending Stock Transfers
        reject_stock_transfers: Reject Stock Transfers
        cancel_stock_transfers: Cancel Stock Transfers
        dispatch_stock_transfers: Dispatch Stock Transfers
        receive_stock_transfers: Receive Stock Transfers
        resolve_stock_transfer_discrepancies: Resolve Transfer Discrepancies
      permission_descriptions:
        view_stock_transfers: View stock transfers and their history, within the warehouses you can access
        create_stock_transfers: Create and edit draft transfers and submit them for approval — submitting reserves the requested stock in the source warehouse; nothing moves until approval
        approve_stock_transfers: Approve a pending transfer — posts the stock movement out of the source and into the destination. You may approve your own requests. Needs access to both warehouses
        edit_pending_stock_transfers: Change the products, quantities and notes of a pending transfer — its reservation is updated with the edit
        reject_stock_transfers: Reject a pending transfer, releasing its reservation — a reason is required
        cancel_stock_transfers: Cancel a draft or pending transfer, releasing any reservation — a reason is required. Posted transfers are voided instead
        dispatch_stock_transfers: Hand an approved transfer over for delivery — moves its stock out of the source warehouse into transit. Needs access to the source warehouse
        receive_stock_transfers: Confirm the quantities that actually arrived (partial receipts allowed) — moves them from transit into the destination warehouse. Needs access to the destination warehouse
        resolve_stock_transfer_discrepancies: 'Settle quantities reported as not received: return them to the source warehouse or write them off as lost — a reason is required. Needs access to both warehouses'
