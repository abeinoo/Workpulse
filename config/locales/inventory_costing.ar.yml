  activerecord:
    errors:
      messages:
        average_cost_audit_failed: "تعذّر تسجيل تغيّر متوسط التكلفة في سجل التدقيق، لذلك لم يُرحَّل شيء. حاول مرة أخرى؛ وإن تكرر ذلك فتواصل مع الدعم."
        reserved_stock_conflict: "%{product} (%{sku}) في %{warehouse}: سحب %{removal} سيترك أقل من %{reserved} المحجوزة لأذونات الصرف المعتمدة %{issues} (المتوفر: %{on_hand}). اصرف تلك الأذونات أو ألغها أولًا، أو اسحب كمية أقل."
