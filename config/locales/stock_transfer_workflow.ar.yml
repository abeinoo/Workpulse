# Stock Transfer approval workflow and transfer reservations
# (Inventory::StockTransfer* services, Inventory::StockAvailability).
ar:
  admin:
    permission_roles:
      groups:
        stock_transfers: تحويلات المخزون
      permissions:
        view_stock_transfers: عرض تحويلات المخزون
        create_stock_transfers: إنشاء تحويلات المخزون
        approve_stock_transfers: اعتماد تحويلات المخزون (ترحيل حركة المخزون)
        edit_pending_stock_transfers: تعديل تحويلات المخزون بانتظار الاعتماد
        reject_stock_transfers: رفض تحويلات المخزون
        cancel_stock_transfers: إلغاء تحويلات المخزون
        dispatch_stock_transfers: إرسال تحويلات المخزون
        receive_stock_transfers: استلام تحويلات المخزون
        resolve_stock_transfer_discrepancies: معالجة فروقات التحويلات
      permission_descriptions:
        view_stock_transfers: عرض تحويلات المخزون وسجلها، ضمن المستودعات التي يمكنك الوصول إليها
        create_stock_transfers: إنشاء مسودات التحويل وتعديلها وإرسالها للاعتماد — الإرسال يحجز الكميات المطلوبة في المستودع المصدر، ولا ينتقل شيء قبل الاعتماد
        approve_stock_transfers: اعتماد تحويل بانتظار الاعتماد — يرحّل حركة المخزون من المصدر إلى الوجهة. يمكنك اعتماد طلباتك. يتطلب الوصول إلى المستودعين
        edit_pending_stock_transfers: تغيير منتجات وكميات وملاحظات تحويل بانتظار الاعتماد — يُحدَّث حجزه مع التعديل
        reject_stock_transfers: رفض تحويل بانتظار الاعتماد وتحرير حجزه — يلزم ذكر السبب
        cancel_stock_transfers: إلغاء مسودة أو تحويل بانتظار الاعتماد وتحرير أي حجز — يلزم ذكر السبب. التحويلات المرحّلة تُلغى بالعكس (Void)
        dispatch_stock_transfers: تسليم تحويل معتمد للتوصيل — يخرج مخزونه من المستودع المصدر إلى البضاعة بالطريق. يتطلب الوصول إلى المستودع المصدر
        receive_stock_transfers: تأكيد الكميات التي وصلت فعلًا (يُسمح بالاستلام الجزئي) — تنتقل من البضاعة بالطريق إلى المستودع الوجهة. يتطلب الوصول إلى المستودع الوجهة
        resolve_stock_transfer_discrepancies: 'تسوية الكميات المبلّغ عن عدم استلامها: إرجاعها إلى المستودع المصدر أو شطبها كمفقودة — يلزم ذكر السبب. يتطلب الوصول إلى المستودعين'
