<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — WorkPulse</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #1A1A24;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
      }

      img {
        width: 80px;
        height: 80px;
        opacity: 0.9;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #00E5FF;
      }

      p {
        font-size: 1rem;
        color: #a0a0b0;
        max-width: 320px;
        line-height: 1.6;
      }

      button {
        margin-top: 0.5rem;
        padding: 0.75rem 2rem;
        background: #00E5FF;
        color: #1A1A24;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover { background: #00c8e0; }
    </style>
  </head>
  <body>
    <img src="/icon.png" alt="WorkPulse">
    <h1>You're offline</h1>
    <p>WorkPulse couldn't connect to the internet. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
