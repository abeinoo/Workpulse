# Bounded container logs: Docker's default json-file driver never rotates, and
# the application log can hold sensitive values (the durable audit last-resort
# entry, D28 — see docs/durable_audit_operations.md). Approved default per owner
# decision D34: 20 MB per file, 5 files (at most 100 MB per container). Takes
# effect when the containers are recreated (docker compose up -d).
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — never expose PostgreSQL publicly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       work_pulse_production
      POSTGRES_USER:     work_pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_pulse -d work_pulse_production"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "127.0.0.1:3000:80"   # Nginx proxies to this port; never bind to 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Rails core
      RAILS_ENV:            production
      DATABASE_URL:         postgresql://work_pulse:${POSTGRES_PASSWORD}@db/work_pulse_production
      RAILS_MASTER_KEY:     ${RAILS_MASTER_KEY}

      APP_HOST:             ${APP_HOST:-example.com}

      # Puma / concurrency
      RAILS_MAX_THREADS:    ${RAILS_MAX_THREADS:-5}
      WEB_CONCURRENCY:      ${WEB_CONCURRENCY:-2}

      # Background jobs (Solid Queue runs inside Puma on single-server setups)
      SOLID_QUEUE_IN_PUMA:  "true"
      JOB_CONCURRENCY:      ${JOB_CONCURRENCY:-2}

      # Logging
      RAILS_LOG_LEVEL:      ${RAILS_LOG_LEVEL:-info}

      # Cloudflare R2 — ActiveStorage in production uses the :cloudflare service.
      # Create API tokens in the Cloudflare dashboard → R2 → Manage API tokens.
      R2_ACCESS_KEY_ID:     ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET:            ${R2_BUCKET}
      R2_ENDPOINT:          ${R2_ENDPOINT}

    volumes:
      # Fallback local storage volume (used for tmp/cache only — uploads go to R2).
      - rails_storage:/rails/storage

volumes:
  postgres_data:
  rails_storage:
