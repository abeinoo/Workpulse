    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch: *lineItemReview
  # PATCH /api/v1/payroll_line_items/{id}/waive was retired (docs/api/baseline.md → D1):
  # it always failed with HTTP 500 and had no client. Waiving a deduction is web-only
  # (Payroll::DeductionWaiver, PayrollLineItemPolicy#waive_deduction?).

  /api/v1/reports/payroll/summary:
    get:
      tags: [Reports]
      summary: Payroll summary for a period (view_payroll_analytics)
      parameters:
        - { name: payroll_period_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: "Not signed in (Devise body) or missing view_payroll_analytics (legacy envelope, message \"Not authorized\")." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/reports/payroll/export:
    get:
      tags: [Reports]
      summary: Payroll CSV export (view_payroll_analytics)
      parameters:
        - { name: payroll_period_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: CSV file., content: { text/csv: { schema: { type: string } } } }
        "401": { description: Not signed in or missing view_payroll_analytics. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/reports/attendance:
    get:
      tags: [Reports]
      summary: Attendance summary (view_employees or manage_employees)
      description: "Limited to the caller's authorized branches (BranchScope, from the configured view_attendance → view_employees scope; default = branches they manage or area-manage). Owners and business-scoped users see the whole business. A branch_id outside that set → 404; business_id params are ignored."
      parameters:
        - { name: start_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: end_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: Not signed in or missing view/manage_employees (legacy envelope). }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
