        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/payroll_periods/{payroll_period_id}/payroll_adjustments/{id}:
    parameters: [{ $ref: "#/components/parameters/PayrollPeriodId" }, { $ref: "#/components/parameters/Id" }]
    delete:
      tags: [Payroll]
      summary: Remove a pending adjustment
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/payroll_line_items/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch: &lineItemReview
      tags: [Payroll]
      summary: Review a payroll line item
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { notes: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
